[DEFAULT]
# Never ban the home network.
#
# Port 22 is already unreachable from the internet -- the nftables ruleset only
# accepts SSH from 192.168.0.0/16 and the tailnet -- so banning a LAN address
# protects against nothing while locking the owner out of their own computer.
# On a machine going to a beginner, three mistyped passwords must not cost them
# access. This was not hypothetical: automated logins during a repair banned the
# administrator, which then looked exactly like sshd having crashed.
ignoreip = 127.0.0.1/8 ::1 192.168.0.0/16 100.64.0.0/10
