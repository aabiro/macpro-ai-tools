# Boot menu for MacPro1,1 + Radeon X1900 XT (32-bit EFI).
#
# WHY THIS EXISTS: the radeon driver cannot read this card's VBIOS (it is a Mac
# EFI ROM, no 0xAA55 signature), so it deactivates the VGA console and then dies.
# Every entry here passes nomodeset, which keeps radeon off the card and leaves
# the EFI framebuffer (2560x1440) driving a working text console.
#
# Do NOT set gfxpayload=keep on this machine: the graphics handover hangs the
# kernel immediately after "Loading initial ramdisk".
#
# Kernel/initrd are found by wildcard and the version is derived by regex, so
# these entries keep working after apt upgrades the kernel.

set timeout=10
set default=0
# Pin the video handover. Leaving this unset lets GRUB choose, and on this
# machine an unpinned handover hangs the kernel before it prints a single
# character -- roughly two cold boots in three. 'keep' hangs it every time.
# 'text' is the only value that boots reliably here.
set gfxpayload=text

insmod part_gpt
insmod ext2
insmod probe
insmod regexp
insmod search_fs_file
insmod all_video
insmod gzio
insmod linux

function find_debian {
    set gfxpayload=text
    search --no-floppy --file --set=root /etc/debian_version
    probe -u ($root) --set=u
    for k in ($root)/boot/vmlinuz-*; do set kern=$k; done
    regexp -s 1:ver 'vmlinuz-(.*)' "$kern"
    set ini=($root)/boot/initrd.img-$ver
}

menuentry "Debian GNU/Linux (normal)" {
    find_debian
    linux $kern root=UUID=$u ro nomodeset earlyprintk=efi,keep
    initrd $ini
}

menuentry "Debian - repair filesystem (forced fsck)" {
    find_debian
    linux $kern root=UUID=$u ro nomodeset earlyprintk=efi,keep fsck.mode=force fsck.repair=yes systemd.unit=multi-user.target
    initrd $ini
}

menuentry "Debian - emergency shell" {
    find_debian
    linux $kern root=UUID=$u ro nomodeset earlyprintk=efi,keep systemd.unit=emergency.target
    initrd $ini
}

menuentry "Debian - full menu from disk (all kernels, Mac OS X)" {
    find_debian
    configfile ($root)/boot/grub/grub.cfg
}

menuentry "Show what was found (diagnostic)" {
    find_debian
    echo "root device : $root"
    echo "fs uuid     : $u"
    echo "kernel      : $kern"
    echo "version     : $ver"
    echo "initrd      : $ini"
    echo ""
    echo "Press a key to return to the menu."
    read _
}

menuentry "Debian - VERBOSE diagnostic (use when a boot fails)" {
    find_debian
    linux $kern root=UUID=$u ro nomodeset earlyprintk=efi,keep initcall_debug ignore_loglevel
    initrd $ini
}
