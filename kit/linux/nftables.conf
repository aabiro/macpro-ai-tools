#!/usr/sbin/nft -f
#
# Mac Pro AI box firewall.
#
# The services on this machine (cockpit :3000, gateway :8081, editor :8443)
# bind 0.0.0.0 and have little or no authentication of their own -- aigw.py's
# own header says do not port-forward it. So this ruleset IS the security
# boundary, not a second layer. Keep it default-drop.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE EDITING: the DHCP rule below is not optional.
#
# The first version of this file omitted `udp dport 68` and the machine lost
# its network on the next cold boot, which looked exactly like a dead machine.
# A DHCP reply arrives from the router's port 67 to the client's port 68, and
# it does NOT match `ct state established`: the request goes out from
# 0.0.0.0:68 to 255.255.255.255:67, so the reply is a different tuple and
# conntrack never associates the two.
#
# It is easy to miss because an already-running machine keeps working -- only
# a cold boot, where the client has to acquire a lease from scratch, exposes it.
# ---------------------------------------------------------------------------

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept

        # DHCP client. See the note above. Without these the machine cannot
        # obtain an address after a reboot.
        udp dport 68 accept
        udp dport 546 accept

        # Tailscale: the encrypted tunnel, and anything arriving through it
        iifname "tailscale0" accept
        udp dport 41641 accept

        # LAN access to the things a human uses
        ip saddr 192.168.0.0/16 tcp dport {
            22,        # ssh
            3000,      # cockpit web console
            8081,      # ai gateway
            8443,      # code-server editor
            24800      # deskflow keyboard/mouse sharing
        } accept

        # Being pingable is worth more than the negligible exposure -- it is the
        # first thing anyone checks when this machine appears to be dead.
        ip saddr 192.168.0.0/16 icmp type echo-request accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert,
                      nd-router-advert } accept

        # mDNS and NetBIOS, so the machine is discoverable by name on the LAN
        ip saddr 192.168.0.0/16 udp dport { 137, 138, 5353 } accept

        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
