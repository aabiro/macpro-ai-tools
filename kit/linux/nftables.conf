#!/usr/sbin/nft -f
#
# Mac Pro AI box firewall.
#
# The services here bind 0.0.0.0 and have little or no authentication of their
# own, so THIS RULESET IS THE SECURITY BOUNDARY, not a second layer. Keep it
# default-drop, and never port-forward any of these from a router.
#
# The DHCP rule is not optional: a reply arrives from the router's port 67 to
# the client's port 68 and does NOT match `ct state established`, because the
# request went out from 0.0.0.0:68 to 255.255.255.255:67 -- a different tuple.
# Omitting it costs the machine its address on the next cold boot, which looks
# exactly like a dead machine.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept

        udp dport 68 accept          # DHCPv4 client -- see note above
        udp dport 546 accept         # DHCPv6 client

        iifname "tailscale0" accept
        udp dport 41641 accept       # tailscale wireguard

        ip saddr 192.168.0.0/16 tcp dport {
            22,        # ssh
            3000,      # AI cockpit web console
            8080,      # Open WebUI chat interface
            8081,      # AI gateway
            8443,      # Visual Studio Code in a browser
            9090,      # cockpit: browser-based system administration
            24800      # deskflow keyboard/mouse sharing
        } accept

        ip saddr 192.168.0.0/16 icmp type echo-request accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert,
                      nd-router-advert } accept

        ip saddr 192.168.0.0/16 udp dport { 137, 138, 5353 } accept

        counter drop
    }
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Container networking. The NAT rules Docker installs are not enough on
        # their own: this chain is consulted too, and a default drop here means
        # containers can reach nothing, which looks like broken DNS inside the
        # container rather than a firewall problem.
        iifname "docker0" accept                              # container -> world
        oifname "docker0" ct state established,related accept # replies back
    }
    chain output  { type filter hook output  priority 0; policy accept; }
}
