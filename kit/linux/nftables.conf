#!/usr/sbin/nft -f
# Mac Pro AI box. Services bind 0.0.0.0 and have little or no auth, so the
# boundary lives here: LAN and tailnet only, never the open internet.
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    iifname "tailscale0" accept
    ip saddr 192.168.0.0/16 tcp dport { 22, 3000, 8081, 8443 } accept
    ip saddr 192.168.0.0/16 icmp type echo-request accept
    ip saddr 192.168.0.0/16 udp dport { 137, 138, 5353 } accept
    udp dport 41641 accept      # tailscale wireguard
    counter drop
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output  priority 0; policy accept; }
}
